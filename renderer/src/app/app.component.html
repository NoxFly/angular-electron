<app-titlebar [class]="{ dark: globalState.known() }"></app-titlebar>

<section [class]="{ known: globalState.known() }">
    @if(isReady()) {
        <main class="main">
            <router-outlet/>
        </main>
    }
</section>

@if(!isReady()) {
    <app-loading-screen @fadeInOut></app-loading-screen>
}
