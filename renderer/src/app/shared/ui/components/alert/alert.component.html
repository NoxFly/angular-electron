<div class="alert-backdrop"></div>

<div class="alert-content">
    @if(title()) {
        <h4>{{ title() }}</h4>
    }

    @if(message()) {
        <p>{{ message() }}</p>
    }

    @if(hasDetails()) {
        <div class="details">
            <button class="btn-details clear btn-primary" [class]="{ opened: detailsOpened() }" (click)="toggleDetails()">
                {{ detailsOpened() ? 'Cacher' : 'Afficher' }} les détails
            </button>

            @if(detailsOpened()) {
                <div [innerHTML]="formattedDetails() | sanitize: 'html'"></div>
            }
        </div>
    }

    @if(hasActions()) {
        <div class="actions">
            @for(action of actions(); track action.text) {
                <button [class]="'btn-' + getButtonRoleClass(action)" (click)="onActionClicked(action)">
                    {{ action.text }}
                </button>
            }
        </div>
    }
</div>
